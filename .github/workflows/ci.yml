name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: lint + typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: integration (real services)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Heavy: only runs when a PR carries the `integration` label, OR when
    # someone triggers the workflow manually from the Actions tab. Never
    # gates a push to main — the integration suite is too service-heavy
    # for a free GitHub runner to boot reliably on every commit.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'integration'))

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci || npm install

      # Bring up a curated subset that fits in the 7 GB runner. The
      # heavier images (sqlserver/amd64-Rosetta, milvus + its etcd/minio
      # deps, elasticsearch, clickhouse, weaviate) are skipped here —
      # they're available locally via `docker compose up` and the
      # integration tests TCP-probe each service before running, so any
      # service we skip simply skips its own test block.
      - name: Boot service subset
        run: |
          docker compose up -d \
            postgres mysql mongo redis etcd kafka rabbit nats neo4j qdrant
          # Give services ~60s to settle. Don't use --wait — one slow
          # service shouldn't fail the whole step. The tests have their
          # own reachability gate and will skipIf a service is unreachable.
          sleep 60
          docker compose ps

      - name: Run integration tests
        run: npm run test:integration

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 > compose.log

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose down -v
