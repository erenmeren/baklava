# Baklava dev/test stack — one local instance of every supported tech.
#
#   docker compose up -d         # start everything
#   docker compose down -v       # stop and wipe data
#   docker compose up -d <svc>   # just one service (postgres, mysql, kafka, sqlserver)
#
# Docker itself is the host daemon — no container needed. Baklava reads
# unix:///var/run/docker.sock by default on macOS/Linux.
#
# All credentials are throwaway and meant ONLY for local development.
# Default baseline: user-appropriate / password `Baklava123!`.
#
# Ports map 1:1 to the host so the Baklava UI can reach each service at
# localhost:<default_port>.
#
# After `up -d`, seed demo data with `bash seed/all.sh` (or per-tech scripts).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: Baklava123!
      POSTGRES_DB: demo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Baklava123!
      MYSQL_DATABASE: demo
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pBaklava123!"]
      interval: 5s
      timeout: 3s
      retries: 15

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft SQL Server ships x86_64-only. Runs on Apple Silicon via Rosetta.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Baklava123!
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Baklava123! -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: YbAkUvK2QaWdh1lUdN6Vlw
